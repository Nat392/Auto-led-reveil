name: Android CI - Alarm Watcher

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17' # Changé de 11 à 17
        distribution: 'temurin'
        cache: gradle

    - name: Cache Gradle build cache
      uses: actions/cache@v5
      with:
        path: |
          ~/.gradle/caches/build-cache-1
        key: ${{ runner.os }}-gradle-build-cache-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', 'gradle.properties', 'settings.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-build-cache-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew --build-cache assembleDebug lintDebug testDebugUnitTest

    - name: Enable KVM group perms
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Run Instrumented Tests
      uses: reactivecircus/android-emulator-runner@v2.37.0
      with:
        api-level: 33
        target: aosp_atd
        arch: x86_64
        force-avd-creation: false
        emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: true
        script: |
          # wait for emulator and grant runtime permissions to debug app (best-effort)
          adb wait-for-device
          adb -s emulator-5554 wait-for-device
          adb -s emulator-5554 shell pm grant com.example.alarmwatcher.debug android.permission.BLUETOOTH_CONNECT || true
          adb -s emulator-5554 shell pm grant com.example.alarmwatcher.debug android.permission.BLUETOOTH_SCAN || true
          adb -s emulator-5554 shell pm grant com.example.alarmwatcher.debug android.permission.POST_NOTIFICATIONS || true
          ./gradlew --build-cache connectedDebugAndroidTest

    - name: Upload Debug APK
      uses: actions/upload-artifact@v7
      with:
        name: alarm-watcher-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
