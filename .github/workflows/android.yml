name: Android CI - Alarm Watcher

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17' # Changé de 11 à 17
        distribution: 'temurin'
        cache: gradle

    - name: Cache Gradle build cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches/build-cache-1
        key: ${{ runner.os }}-gradle-build-cache-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', 'gradle.properties', 'settings.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-build-cache-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew --build-cache assembleDebug lintDebug testDebugUnitTest jacocoDebugUnitTestReport

    - name: Comment coverage on PR
      if: github.event_name == 'pull_request'
      id: pr_jacoco
      uses: madrapps/jacoco-report@v1.7.2
      with:
        paths: ${{ github.workspace }}/app/build/reports/jacoco/jacocoDebugUnitTestReport/jacocoDebugUnitTestReport.xml
        token: ${{ secrets.GITHUB_TOKEN }}
        title: Coverage Report
        update-comment: true
        comment-type: pr_comment

    - name: Checkout main branch for baseline coverage
      if: github.event_name == 'pull_request'
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event.pull_request.base.ref }}
        path: main-baseline

    - name: Generate baseline coverage report
      if: github.event_name == 'pull_request'
      working-directory: main-baseline
      run: |
        chmod +x gradlew
        ./gradlew --build-cache testDebugUnitTest jacocoDebugUnitTestReport

    - name: Summarize baseline coverage
      if: github.event_name == 'pull_request'
      id: baseline_jacoco
      uses: madrapps/jacoco-report@v1.7.2
      with:
        paths: ${{ github.workspace }}/main-baseline/app/build/reports/jacoco/jacocoDebugUnitTestReport/jacocoDebugUnitTestReport.xml
        token: ${{ secrets.GITHUB_TOKEN }}
        title: Baseline Coverage
        update-comment: false
        comment-type: summary

    - name: Fail if coverage regresses versus main
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      env:
        PR_COVERAGE: ${{ steps.pr_jacoco.outputs.coverage-overall }}
        BASE_COVERAGE: ${{ steps.baseline_jacoco.outputs.coverage-overall }}
      with:
        script: |
          const parseCoverage = (value) => Number.parseFloat(String(value).replace('%', '').trim());
          const prCoverage = parseCoverage(process.env.PR_COVERAGE);
          const baseCoverage = parseCoverage(process.env.BASE_COVERAGE);

          if (Number.isNaN(prCoverage) || Number.isNaN(baseCoverage)) {
            core.setFailed(`Unable to read coverage values. PR=${process.env.PR_COVERAGE}, main=${process.env.BASE_COVERAGE}`);
            return;
          }

          if (prCoverage < baseCoverage) {
            core.setFailed(`Coverage regressed: PR ${prCoverage.toFixed(2)}% < main ${baseCoverage.toFixed(2)}%`);
          } else {
            core.summary
              .addHeading('Coverage comparison')
              .addTable([
                [{ data: 'Branch', header: true }, { data: 'Overall coverage', header: true }],
                ['main', `${baseCoverage.toFixed(2)}%`],
                ['PR', `${prCoverage.toFixed(2)}%`]
              ])
              .write();
          }

    - name: Enable KVM group perms
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Run Instrumented Tests
      uses: reactivecircus/android-emulator-runner@v2.33.0
      with:
        api-level: 33
        target: aosp_atd
        arch: x86_64
        force-avd-creation: false
        emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: true
        script: |
          # wait for emulator and grant runtime permissions to debug app (best-effort)
          adb wait-for-device
          adb -s emulator-5554 wait-for-device
          adb -s emulator-5554 shell pm grant com.example.alarmwatcher.debug android.permission.BLUETOOTH_CONNECT || true
          adb -s emulator-5554 shell pm grant com.example.alarmwatcher.debug android.permission.BLUETOOTH_SCAN || true
          adb -s emulator-5554 shell pm grant com.example.alarmwatcher.debug android.permission.POST_NOTIFICATIONS || true
          ./gradlew --build-cache connectedDebugAndroidTest

    - name: Upload Debug APK
      uses: actions/upload-artifact@v7
      with:
        name: alarm-watcher-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Coverage Report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: alarm-watcher-jacoco-report
        path: app/build/reports/jacoco/jacocoDebugUnitTestReport/
        if-no-files-found: ignore
