name: Android CI - Alarm Watcher

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: "Git ref to test when launched manually"
        required: false
        type: string
      checkout_sha:
        description: "Commit SHA to test when launched manually"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      pr_coverage: ${{ steps.pr_jacoco.outputs.coverage-overall }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.checkout_sha || github.sha }}

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17' # Changé de 11 à 17
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew --build-cache assembleDebug lintDebug ktlintCheck detekt testDebugUnitTest jacocoDebugUnitTestReport

    - name: Build Release APK
      run: ./gradlew --build-cache assembleRelease

    - name: Comment coverage on PR
      if: github.event_name == 'pull_request'
      id: pr_jacoco
      uses: madrapps/jacoco-report@v1.7.2
      with:
        paths: ${{ github.workspace }}/app/build/reports/jacoco/jacocoDebugUnitTestReport/jacocoDebugUnitTestReport.xml
        token: ${{ secrets.GITHUB_TOKEN }}
        title: Coverage Report
        update-comment: true
        comment-type: pr_comment

    - name: Upload Coverage Report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: alarm-watcher-jacoco-report
        path: app/build/reports/jacoco/jacocoDebugUnitTestReport/
        if-no-files-found: ignore

    - name: Enable KVM group perms
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Run Instrumented Tests
      uses: reactivecircus/android-emulator-runner@v2.37.0
      with:
        api-level: 33
        target: aosp_atd
        arch: x86_64
        force-avd-creation: false
        emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: true
        script: |
          # wait for emulator and grant runtime permissions to debug app (best-effort)
          adb wait-for-device
          adb -s emulator-5554 wait-for-device
          adb -s emulator-5554 shell pm grant com.example.alarmwatcher.debug android.permission.BLUETOOTH_CONNECT || true
          adb -s emulator-5554 shell pm grant com.example.alarmwatcher.debug android.permission.BLUETOOTH_SCAN || true
          adb -s emulator-5554 shell pm grant com.example.alarmwatcher.debug android.permission.POST_NOTIFICATIONS || true
          ./gradlew --build-cache connectedDebugAndroidTest

    - name: Upload Debug APK
      uses: actions/upload-artifact@v7
      with:
        name: alarm-watcher-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk

  baseline_coverage:
    name: Baseline Coverage
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout main branch for baseline coverage
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event.pull_request.base.ref }}
        path: main-baseline

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17' # Changé de 11 à 17
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Generate baseline coverage report
      working-directory: main-baseline
      run: |
        chmod +x gradlew
        ./gradlew --build-cache testDebugUnitTest jacocoDebugUnitTestReport

    - name: Extract baseline coverage
      id: baseline_coverage
      shell: bash
      run: |
        python - <<'PY'
        import os
        import xml.etree.ElementTree as ET

        report_path = os.path.join(
            os.environ["GITHUB_WORKSPACE"],
            "main-baseline",
            "app",
            "build",
            "reports",
            "jacoco",
            "jacocoDebugUnitTestReport",
            "jacocoDebugUnitTestReport.xml",
        )

        root = ET.parse(report_path).getroot()
        counter = next(node for node in root.findall("counter") if node.attrib["type"] == "INSTRUCTION")
        covered = float(counter.attrib["covered"])
        missed = float(counter.attrib["missed"])
        total = covered + missed
        coverage = 0.0 if total == 0 else (covered / total) * 100.0

        print(f"coverage={coverage:.2f}")

        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output_file:
            output_file.write(f"baseline_coverage={coverage:.2f}\n")
        PY

    outputs:
      baseline_coverage: ${{ steps.baseline_coverage.outputs.baseline_coverage }}

  compare_coverage:
    name: Compare Coverage
    if: github.event_name == 'pull_request'
    needs: [build, baseline_coverage]
    runs-on: ubuntu-latest

    steps:
    - name: Fail if coverage regresses versus main
      uses: actions/github-script@v9
      env:
        PR_COVERAGE: ${{ needs.build.outputs.pr_coverage }}
        BASE_COVERAGE: ${{ needs.baseline_coverage.outputs.baseline_coverage }}
      with:
        script: |
          const parseCoverage = (value) => Number.parseFloat(String(value).replace('%', '').trim());
          const prCoverage = parseCoverage(process.env.PR_COVERAGE);
          const baseCoverage = parseCoverage(process.env.BASE_COVERAGE);

          if (Number.isNaN(prCoverage) || Number.isNaN(baseCoverage)) {
            core.setFailed(`Unable to read coverage values. PR=${process.env.PR_COVERAGE}, main=${process.env.BASE_COVERAGE}`);
            return;
          }

          if (prCoverage < baseCoverage) {
            core.setFailed(`Coverage regressed: PR ${prCoverage.toFixed(2)}% < main ${baseCoverage.toFixed(2)}%`);
          } else {
            core.summary
              .addHeading('Coverage comparison')
              .addTable([
                [{ data: 'Branch', header: true }, { data: 'Overall coverage', header: true }],
                ['main', `${baseCoverage.toFixed(2)}%`],
                ['PR', `${prCoverage.toFixed(2)}%`]
              ])
              .write();
          }
