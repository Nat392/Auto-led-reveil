name: Dependabot Auto-merge

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: "Numéro de PR Dependabot à traiter (vide = toutes les PR Dependabot ouvertes)"
        required: false
        type: string

permissions:
  contents: write
  actions: write
  pull-requests: write

jobs:
  enable-auto-merge:
    name: Enable auto-merge for a Dependabot PR
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'

    concurrency:
      group: dependabot-automerge-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Ensure Android CI has a usable run for this commit
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}
          script: |
            const androidWorkflowName = 'Android CI - Alarm Watcher';
            const androidWorkflowFileName = 'android.yml';
            const pullRequest = context.payload.pull_request;

            // A pull_request-triggered run for a Dependabot PR is always stuck on "action_required"
            // (it can't be approved, since it's not a fork PR) — ignore it and dispatch a real run instead.
            const { data: workflowRuns } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: pullRequest.head.sha,
              per_page: 100,
            });

            const hasUsableRun = workflowRuns.workflow_runs.some(
              (run) => run.name === androidWorkflowName && run.conclusion !== 'action_required'
            );

            if (hasUsableRun) {
              core.info(`Android CI already has a usable run for ${pullRequest.head.sha}.`);
              return;
            }

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: androidWorkflowFileName,
              ref: pullRequest.head.ref,
            });

            core.info(`Triggered Android CI for PR #${pullRequest.number} on branch ${pullRequest.head.ref} (${pullRequest.head.sha}).`);

      - name: Enable auto-merge
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}
          pull-request-number: ${{ github.event.pull_request.number }}
          merge-method: squash

  backfill:
    name: Update behind branches and enable auto-merge for Dependabot PRs
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    concurrency:
      group: dependabot-automerge-backfill
      cancel-in-progress: false

    steps:
      - name: Process Dependabot PRs
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}
          script: |
            const androidWorkflowName = 'Android CI - Alarm Watcher';
            const androidWorkflowFileName = 'android.yml';

            const isDependabotPullRequest = (pullRequest) => pullRequest.user?.login === 'dependabot[bot]';

            const wait = (seconds) => new Promise((resolve) => setTimeout(resolve, seconds * 1000));

            const waitForBranchUpdate = async (pullNumber, previousHeadSha, { timeoutMinutes = 5, pollIntervalSeconds = 10 } = {}) => {
              const deadline = Date.now() + timeoutMinutes * 60 * 1000;

              while (Date.now() < deadline) {
                const { data: pullRequest } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pullNumber,
                });

                if (pullRequest.head.sha !== previousHeadSha) {
                  return pullRequest;
                }

                await wait(pollIntervalSeconds);
              }

              return null;
            };

            const hasUsableAndroidCiRun = async (headSha) => {
              const { data: workflowRuns } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: headSha,
                per_page: 100,
              });

              return workflowRuns.workflow_runs.some(
                (run) => run.name === androidWorkflowName && run.conclusion !== 'action_required'
              );
            };

            const enableAutoMerge = async (pullRequest) => {
              try {
                await github.graphql(
                  `mutation($pullRequestId: ID!) {
                    enablePullRequestAutoMerge(input: { pullRequestId: $pullRequestId, mergeMethod: SQUASH }) {
                      pullRequest { number }
                    }
                  }`,
                  { pullRequestId: pullRequest.node_id }
                );
                core.info(`Auto-merge enabled for PR #${pullRequest.number}.`);
              } catch (error) {
                core.warning(`Could not enable auto-merge for PR #${pullRequest.number}: ${error.message}`);
              }
            };

            const getCandidatePullRequestNumbers = async () => {
              const requestedPullRequestNumber = Number.parseInt(context.payload.inputs?.pull_request_number ?? '', 10);

              if (!Number.isNaN(requestedPullRequestNumber)) {
                return [requestedPullRequestNumber];
              }

              const { data: openPullRequests } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100,
              });

              return openPullRequests.filter(isDependabotPullRequest).map((pullRequest) => pullRequest.number);
            };

            const pullRequestNumbers = await getCandidatePullRequestNumbers();

            if (pullRequestNumbers.length === 0) {
              core.info('No candidate Dependabot PRs were found.');
              return;
            }

            for (const pullRequestNumber of pullRequestNumbers) {
              try {
                let { data: pullRequest } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pullRequestNumber,
                });

                core.info(`Evaluating PR #${pullRequest.number}: ${pullRequest.title}`);

                if (!isDependabotPullRequest(pullRequest) || pullRequest.state !== 'open') {
                  core.info(`Skipping PR #${pullRequest.number} (not an open Dependabot PR).`);
                  continue;
                }

                if (pullRequest.mergeable_state === 'behind') {
                  core.info(`PR #${pullRequest.number} is behind ${pullRequest.base.ref}, updating the branch...`);

                  await github.rest.pulls.updateBranch({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: pullRequest.number,
                  });

                  const updatedPullRequest = await waitForBranchUpdate(pullRequest.number, pullRequest.head.sha);

                  if (!updatedPullRequest) {
                    core.warning(`Timed out waiting for the branch update of PR #${pullRequest.number}.`);
                    continue;
                  }

                  pullRequest = updatedPullRequest;
                  core.info(`PR #${pullRequest.number} updated to ${pullRequest.head.sha}.`);
                }

                if (!(await hasUsableAndroidCiRun(pullRequest.head.sha))) {
                  await github.rest.actions.createWorkflowDispatch({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    workflow_id: androidWorkflowFileName,
                    ref: pullRequest.head.ref,
                  });

                  core.info(`Triggered Android CI for PR #${pullRequest.number} on branch ${pullRequest.head.ref} (${pullRequest.head.sha}).`);
                }

                if (pullRequest.auto_merge) {
                  core.info(`Auto-merge already enabled for PR #${pullRequest.number}.`);
                  continue;
                }

                await enableAutoMerge(pullRequest);
              } catch (error) {
                core.warning(`Error while processing PR #${pullRequestNumber}: ${error.message}`);
              }
            }
