name: Dependabot Auto-merge

on:
  push:
    branches:
      - main
  schedule:
    - cron: '*/15 * * * *'
  workflow_run:
    workflows:
      - Android CI - Alarm Watcher
    types:
      - completed
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: "Numéro de PR Dependabot à traiter (vide = toutes les PR Dependabot ouvertes)"
        required: false
        type: string

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: dependabot-automerge
  cancel-in-progress: false

jobs:
  automerge:
    name: Enable auto-merge after CI success
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Force merge for Dependabot PRs with green CI
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}
          script: |
            const androidWorkflowName = 'Android CI - Alarm Watcher';

            const isDependabotPullRequest = (pullRequest) => pullRequest.user?.login === 'dependabot[bot]';

            const isMergeablePullRequest = (pullRequest) => pullRequest.mergeable === true;

            const wait = (seconds) => new Promise((resolve) => setTimeout(resolve, seconds * 1000));

            const waitForMergeableDecision = async (pullNumber, { timeoutSeconds = 60, pollIntervalSeconds = 3 } = {}) => {
              const deadline = Date.now() + timeoutSeconds * 1000;
              let pullRequest;

              do {
                ({ data: pullRequest } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pullNumber,
                }));

                if (pullRequest.mergeable !== null) {
                  return pullRequest;
                }

                await wait(pollIntervalSeconds);
              } while (Date.now() < deadline);

              return pullRequest;
            };

            const hasSuccessfulAndroidCiRun = async (pullRequest) => {
              const { data: workflowRuns } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: pullRequest.head.sha,
                per_page: 100,
              });

              return workflowRuns.workflow_runs.some((run) => run.name === androidWorkflowName && run.conclusion === 'success');
            };

            // GitHub only finishes computing mergeable_state ("clean" once every required status check has
            // reported, not just the Android CI one we track above) a little while after the checks complete,
            // so wait for it instead of immediately attempting a merge that branch protection would reject.
            const waitForCleanMergeState = async (pullNumber, { timeoutMinutes = 5, pollIntervalSeconds = 15 } = {}) => {
              const deadline = Date.now() + timeoutMinutes * 60 * 1000;
              let pullRequest;

              do {
                ({ data: pullRequest } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pullNumber,
                }));

                if (pullRequest.mergeable_state === 'clean' || !isMergeablePullRequest(pullRequest)) {
                  return pullRequest;
                }

                await wait(pollIntervalSeconds);
              } while (Date.now() < deadline);

              return pullRequest;
            };

            const mergePullRequest = async (pullRequest) => {
              const maxAttempts = 3;
              for (let attempt = 1; attempt <= maxAttempts; attempt++) {
                try {
                  core.info(`Merge attempt ${attempt}/${maxAttempts} for PR #${pullRequest.number}...`);
                  await github.rest.pulls.merge({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: pullRequest.number,
                    merge_method: 'squash',
                  });
                  core.info(`✅ Successfully merged PR #${pullRequest.number}.`);
                  return true;
                } catch (error) {
                  core.warning(`Attempt ${attempt} failed for PR #${pullRequest.number}: ${error.message}`);
                  if (attempt === maxAttempts) {
                    core.error(`❌ Unable to merge PR #${pullRequest.number} after ${maxAttempts} attempts.`);
                    return false;
                  }
                  await wait(5);
                }
              }
            };

            const { data: openPullRequests } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });

            const candidates = openPullRequests.filter(isDependabotPullRequest);

            if (candidates.length === 0) {
              core.info('No open Dependabot PRs were found.');
              return;
            }

            for (const candidate of candidates) {
              const pullRequest = await waitForMergeableDecision(candidate.number);

              core.info(`Evaluating PR #${pullRequest.number}: ${pullRequest.title}`);

              if (!isMergeablePullRequest(pullRequest)) {
                core.info(`Skipping PR #${pullRequest.number} because GitHub reports it as not mergeable.`);
                continue;
              }

              if (!(await hasSuccessfulAndroidCiRun(pullRequest))) {
                core.info(`Skipping PR #${pullRequest.number} because Android CI has not succeeded for ${pullRequest.head.sha}.`);
                continue;
              }

              const cleanPullRequest = await waitForCleanMergeState(pullRequest.number);

              if (cleanPullRequest.mergeable_state !== 'clean') {
                core.info(`Skipping PR #${cleanPullRequest.number} because required status checks are not all green yet (mergeable_state="${cleanPullRequest.mergeable_state}"); will retry on the next trigger.`);
                continue;
              }

              core.info(`CI is green. Forcing merge for PR #${cleanPullRequest.number} now...`);
              await mergePullRequest(cleanPullRequest);
            }

  retroactive:
    name: Update, wait for CI, and force merge for Dependabot PRs
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 90

    steps:
      - name: Process Dependabot PRs
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}
          script: |
            const androidWorkflowName = 'Android CI - Alarm Watcher';
            const androidWorkflowFileName = 'android.yml';

            const isDependabotPullRequest = (pullRequest) => pullRequest.user?.login === 'dependabot[bot]';

            const isMergeablePullRequest = (pullRequest) => pullRequest.mergeable === true;

            const mergePullRequest = async (pullRequest) => {
              const maxAttempts = 3;
              for (let attempt = 1; attempt <= maxAttempts; attempt++) {
                try {
                  core.info(`Merge attempt ${attempt}/${maxAttempts} for PR #${pullRequest.number}...`);
                  await github.rest.pulls.merge({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: pullRequest.number,
                    merge_method: 'squash',
                  });
                  core.info(`✅ Successfully merged PR #${pullRequest.number}.`);
                  return true;
                } catch (error) {
                  core.warning(`Attempt ${attempt} failed for PR #${pullRequest.number}: ${error.message}`);
                  if (attempt === maxAttempts) {
                    core.error(`❌ Unable to merge PR #${pullRequest.number} after ${maxAttempts} attempts.`);
                    return false;
                  }
                  await wait(5); 
                }
              }
            };

            const triggerAndroidCiRun = async (pullRequest) => {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: androidWorkflowFileName,
                ref: pullRequest.head.ref,
              });

              core.info(`Triggered Android CI for PR #${pullRequest.number} on branch ${pullRequest.head.ref} (${pullRequest.head.sha}), so the resulting check attaches to this commit.`);
            };

            const getAndroidCiRun = async (headSha) => {
              const { data: workflowRuns } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: headSha,
                per_page: 100,
              });

              // Dependabot's pull_request-triggered run is always stuck on "action_required" (it can't be
              // approved, since it's not a fork PR) — ignore it so callers fall back to the workflow_dispatch run.
              return workflowRuns.workflow_runs.find((run) => run.name === androidWorkflowName && run.conclusion !== 'action_required');
            };

            const wait = (seconds) => new Promise((resolve) => setTimeout(resolve, seconds * 1000));

            const waitForAndroidCiConclusion = async (headSha, { timeoutMinutes = 20, pollIntervalSeconds = 30 } = {}) => {
              const deadline = Date.now() + timeoutMinutes * 60 * 1000;

              while (Date.now() < deadline) {
                const run = await getAndroidCiRun(headSha);

                if (run && run.status === 'completed') {
                  return run.conclusion;
                }

                await wait(pollIntervalSeconds);
              }

              return null;
            };

            const waitForMergeableDecision = async (pullNumber, { timeoutSeconds = 60, pollIntervalSeconds = 3 } = {}) => {
              const deadline = Date.now() + timeoutSeconds * 1000;
              let pullRequest;

              do {
                ({ data: pullRequest } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pullNumber,
                }));

                if (pullRequest.mergeable !== null) {
                  return pullRequest;
                }

                await wait(pollIntervalSeconds);
              } while (Date.now() < deadline);

              return pullRequest;
            };

            // GitHub only finishes computing mergeable_state ("clean" once every required status check has
            // reported, not just the Android CI one we track above) a little while after the checks complete,
            // so wait for it instead of immediately attempting a merge that branch protection would reject.
            const waitForCleanMergeState = async (pullNumber, { timeoutMinutes = 5, pollIntervalSeconds = 15 } = {}) => {
              const deadline = Date.now() + timeoutMinutes * 60 * 1000;
              let pullRequest;

              do {
                ({ data: pullRequest } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pullNumber,
                }));

                if (pullRequest.mergeable_state === 'clean' || !isMergeablePullRequest(pullRequest)) {
                  return pullRequest;
                }

                await wait(pollIntervalSeconds);
              } while (Date.now() < deadline);

              return pullRequest;
            };

            const waitForBranchUpdate = async (pullNumber, previousHeadSha, { timeoutMinutes = 5, pollIntervalSeconds = 10 } = {}) => {
              const deadline = Date.now() + timeoutMinutes * 60 * 1000;

              while (Date.now() < deadline) {
                const { data: pullRequest } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pullNumber,
                });

                if (pullRequest.head.sha !== previousHeadSha) {
                  return pullRequest;
                }

                await wait(pollIntervalSeconds);
              }

              return null;
            };

            const getCandidatePullRequestNumbers = async () => {
              const requestedPullRequestNumber = Number.parseInt(context.payload.inputs?.pull_request_number ?? '', 10);

              if (!Number.isNaN(requestedPullRequestNumber)) {
                return [requestedPullRequestNumber];
              }

              const { data: openPullRequests } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100,
              });

              return openPullRequests.filter(isDependabotPullRequest).map((pullRequest) => pullRequest.number);
            };

            const pullRequestNumbers = await getCandidatePullRequestNumbers();

            if (pullRequestNumbers.length === 0) {
              core.info('No candidate Dependabot PRs were found.');
              return;
            }

            for (const pullRequestNumber of pullRequestNumbers) {
              try {
                let { data: pullRequest } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pullRequestNumber,
                });

                core.info(`Evaluating PR #${pullRequest.number}: ${pullRequest.title}`);

                if (!isDependabotPullRequest(pullRequest)) {
                  core.info(`Skipping PR #${pullRequest.number} because it is not opened by Dependabot.`);
                  continue;
                }

                if (pullRequest.state !== 'open') {
                  core.info(`Skipping PR #${pullRequest.number} because it is not open.`);
                  continue;
                }

                if (pullRequest.mergeable_state === 'behind') {
                  core.info(`PR #${pullRequest.number} is behind ${pullRequest.base.ref}, updating the branch...`);

                  await github.rest.pulls.updateBranch({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: pullRequest.number,
                  });

                  const updatedPullRequest = await waitForBranchUpdate(pullRequest.number, pullRequest.head.sha);

                  if (!updatedPullRequest) {
                    core.warning(`Timed out waiting for the branch update of PR #${pullRequest.number}.`);
                    continue;
                  }

                  pullRequest = updatedPullRequest;
                  core.info(`PR #${pullRequest.number} updated to ${pullRequest.head.sha}.`);
                }

                let existingRun = await getAndroidCiRun(pullRequest.head.sha);

                if (!existingRun) {
                  core.info(`No Android CI run found for PR #${pullRequest.number} at ${pullRequest.head.sha}, triggering one...`);
                  await triggerAndroidCiRun(pullRequest);
                } else if (existingRun.status === 'completed') {
                  core.info(`Android CI for PR #${pullRequest.number} already concluded with "${existingRun.conclusion}".`);
                } else {
                  core.info(`Android CI for PR #${pullRequest.number} is already running, waiting for it to finish...`);
                }

                let conclusion = existingRun?.status === 'completed' ? existingRun.conclusion : null;

                if (conclusion === null) {
                  conclusion = await waitForAndroidCiConclusion(pullRequest.head.sha);
                }

                if (conclusion === null) {
                  core.warning(`Timed out waiting for Android CI on PR #${pullRequest.number}, skipping.`);
                  continue;
                }

                if (conclusion !== 'success') {
                  core.info(`Android CI for PR #${pullRequest.number} concluded with "${conclusion}", skipping auto-merge.`);
                  continue;
                }

                const refreshedPullRequest = await waitForMergeableDecision(pullRequest.number);

                if (!isMergeablePullRequest(refreshedPullRequest)) {
                  core.info(`Skipping PR #${refreshedPullRequest.number} because GitHub reports it as not mergeable.`);
                  continue;
                }

                const cleanPullRequest = await waitForCleanMergeState(refreshedPullRequest.number);

                if (cleanPullRequest.mergeable_state !== 'clean') {
                  core.warning(`Skipping PR #${cleanPullRequest.number} because required status checks are not all green yet (mergeable_state="${cleanPullRequest.mergeable_state}"); will retry on the next trigger.`);
                  continue;
                }

                core.info(`CI is green and PR #${cleanPullRequest.number} is mergeable. Forcing merge now...`);
                await mergePullRequest(cleanPullRequest);
              } catch (error) {
                core.warning(`Error while processing PR #${pullRequestNumber}: ${error.message}`);
              }
            }

  trigger-pending-ci:
    name: Trigger Android CI for Dependabot PRs stuck on approval
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'push'

    steps:
      - name: Update behind branches and dispatch Android CI where needed
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}
          script: |
            const androidWorkflowName = 'Android CI - Alarm Watcher';
            const androidWorkflowFileName = 'android.yml';

            const isDependabotPullRequest = (pullRequest) => pullRequest.user?.login === 'dependabot[bot]';

            const getDispatchedAndroidCiRun = async (headSha) => {
              const { data: workflowRuns } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: headSha,
                per_page: 100,
              });

              return workflowRuns.workflow_runs.find((run) => run.name === androidWorkflowName && run.event === 'workflow_dispatch');
            };

            const hasSuccessfulAndroidCiRun = async (headSha) => {
              const { data: workflowRuns } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: headSha,
                per_page: 100,
              });

              return workflowRuns.workflow_runs.some((run) => run.name === androidWorkflowName && run.conclusion === 'success');
            };

            const wait = (seconds) => new Promise((resolve) => setTimeout(resolve, seconds * 1000));

            // automerge only retries the merge on the next "Android CI - Alarm Watcher" workflow_run
            // completion; if mergeable_state isn't "clean" yet by the time it checks (e.g. CodeQL still
            // reporting), nothing else retries the merge for an already-green PR until this job's next
            // push/schedule trigger picks it up here instead of just re-dispatching CI.
            const mergePullRequest = async (pullRequest) => {
              const maxAttempts = 3;
              for (let attempt = 1; attempt <= maxAttempts; attempt++) {
                try {
                  core.info(`Merge attempt ${attempt}/${maxAttempts} for PR #${pullRequest.number}...`);
                  await github.rest.pulls.merge({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: pullRequest.number,
                    merge_method: 'squash',
                  });
                  core.info(`✅ Successfully merged PR #${pullRequest.number}.`);
                  return true;
                } catch (error) {
                  core.warning(`Attempt ${attempt} failed for PR #${pullRequest.number}: ${error.message}`);
                  if (attempt === maxAttempts) {
                    core.error(`❌ Unable to merge PR #${pullRequest.number} after ${maxAttempts} attempts.`);
                    return false;
                  }
                  await wait(5);
                }
              }
            };

            const waitForBranchUpdate = async (pullNumber, previousHeadSha, { timeoutMinutes = 5, pollIntervalSeconds = 10 } = {}) => {
              const deadline = Date.now() + timeoutMinutes * 60 * 1000;

              while (Date.now() < deadline) {
                const { data: pullRequest } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pullNumber,
                });

                if (pullRequest.head.sha !== previousHeadSha) {
                  return pullRequest;
                }

                await wait(pollIntervalSeconds);
              }

              return null;
            };

            const { data: openPullRequests } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });

            const candidates = openPullRequests.filter(isDependabotPullRequest);

            if (candidates.length === 0) {
              core.info('No open Dependabot PRs were found.');
              return;
            }

            for (const candidate of candidates) {
              try {
                let { data: pullRequest } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: candidate.number,
                });

                if (pullRequest.mergeable_state === 'behind') {
                  core.info(`PR #${pullRequest.number} is behind ${pullRequest.base.ref}, updating the branch...`);

                  await github.rest.pulls.updateBranch({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: pullRequest.number,
                  });

                  const updatedPullRequest = await waitForBranchUpdate(pullRequest.number, pullRequest.head.sha);

                  if (!updatedPullRequest) {
                    core.warning(`Timed out waiting for the branch update of PR #${pullRequest.number}.`);
                    continue;
                  }

                  pullRequest = updatedPullRequest;
                  core.info(`PR #${pullRequest.number} updated to ${pullRequest.head.sha}.`);
                }

                if (pullRequest.mergeable === true && (await hasSuccessfulAndroidCiRun(pullRequest.head.sha))) {
                  if (pullRequest.mergeable_state === 'clean') {
                    core.info(`CI is green and PR #${pullRequest.number} is clean. Forcing merge now...`);
                    await mergePullRequest(pullRequest);
                    continue;
                  }

                  core.info(`CI succeeded for PR #${pullRequest.number} but mergeable_state is "${pullRequest.mergeable_state}"; will check again next run.`);
                  continue;
                }

                if (await getDispatchedAndroidCiRun(pullRequest.head.sha)) {
                  core.info(`Android CI already dispatched for PR #${pullRequest.number} at ${pullRequest.head.sha}.`);
                  continue;
                }

                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: androidWorkflowFileName,
                  ref: pullRequest.head.ref,
                });

                core.info(`Triggered Android CI for PR #${pullRequest.number} on branch ${pullRequest.head.ref} (${pullRequest.head.sha}).`);
              } catch (error) {
                core.warning(`Error while processing PR #${candidate.number}: ${error.message}`);
              }
            }
